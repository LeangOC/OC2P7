name: Continuous Integration

on:
  push:
    branches: [dev3]
  pull_request:
    branches: [dev3]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          
      - name: Check file permissions
        run: ls -l gradlew

      - name: Check Git file mode
        run: git ls-files --stage gradlew
      
      - run: ./gradlew build